<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito Automotivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; padding: 35px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        h2 { margin-bottom: 25px; text-align: center; color: #0284c7; font-size: 24px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #64748b; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; color: #0f172a; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #0284c7; background-color: #ffffff; }
        button { width: 100%; padding: 14px; background-color: #0284c7; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        button:hover { background-color: #0369a1; }
        .resultado { margin-top: 25px; padding: 16px; border-radius: 8px; display: none; font-size: 15px; line-height: 1.6; }
        .aprovado { background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
        .reprovado { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .alerta-backend { font-size: 11px; color: #64748b; background-color: #f8fafc; padding: 8px; border-radius: 6px; border: 1px dashed #cbd5e1; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Análise de Crédito</h2>
        <div class="form-group">
            <label>Renda Mensal (R$)</label>
            <input type="number" id="renda_mensal" placeholder="Ex: 3500">
        </div>
        <div class="form-group">
            <label>Valor do Veículo (R$)</label>
            <input type="number" id="valor_veiculo" placeholder="Ex: 50000">
        </div>
        <div class="form-group">
            <label>Valor da Entrada (R$)</label>
            <input type="number" id="valor_entrada" placeholder="Ex: 10000">
        </div>
        <div class="form-group">
            <label>Quantidade de Parcelas</label>
            <select id="parcelas">
                <option value="12">12x</option>
                <option value="24">24x</option>
                <option value="36">36x</option>
                <option value="48">48x</option>
                <option value="60">60x</option>
            </select>
        </div>
        <button onclick="enviarSimulacao()">Simular Financiamento</button>
        <div id="resultado" class="resultado"></div>
        <div class="alerta-backend">
            💡 Nota de Portfólio: Este front-end consome uma API em Python (FastAPI). No GitHub Pages, a lógica roda em modo de simulação local via JavaScript.
        </div>
    </div>

    <script>
        // Função com a lógica espelho do Back-end para rodar direto no navegador se o Python estiver desligado
        function processarSimulacaoLocal(dados) {
            const entradaMinima = dados.valor_veiculo * 0.20;
            if (dados.valor_entrada < entradaMinima) {
                return {
                    status: "REPROVADO",
                    motivo: `Valor de entrada insuficiente. O valor mínimo exigido é de R$ ${entradaMinima.toLocaleString('pt-BR', {minimumFractionDigits: 2})} (20% do veículo).`
                };
            }
            
            const valorFinanciar = dados.valor_veiculo - dados.valor_entrada;
            const taxaJurosMensal = 0.015; // 1.5% ao mês
            
            const fator = Math.pow((1 + taxaJurosMensal), dados.parcelas);
            const valorParcela = valorFinanciar * (taxa_juros_mensal * fator) / (fator - 1);
                
            const limiteComprometimento = dados.renda_mensal * 0.30;
            if (valorParcela > limiteComprometimento) {
                return {
                    status: "REPROVADO",
                    motivo: `Parcela de R$ ${valorParcela.toLocaleString('pt-BR', {minimumFractionDigits: 2})} ultrapassa o limite de 30% da sua renda mensal (R$ ${limiteComprometimento.toLocaleString('pt-BR', {minimumFractionDigits: 2})}).`
                };
            }
                
            return {
                status: "APROVADO",
                detalhes: {
                    valor_financiado: valorFinanciar,
                    quantidade_parcelas: dados.parcelas,
                    valor_parcela: valorParcela,
                    taxa_applied_mes: "1.5%"
                }
            };
        }

        async function enviarSimulacao() {
            const dados = {
                renda_mensal: parseFloat(document.getElementById('renda_mensal').value),
                valor_veiculo: parseFloat(document.getElementById('valor_veiculo').value),
                valor_entrada: parseFloat(document.getElementById('valor_entrada').value),
                parcelas: parseInt(document.getElementById('parcelas').value)
            };

            if (isNaN(dados.renda_mensal) || isNaN(dados.valor_veiculo) || isNaN(dados.valor_entrada)) {
                alert('Por favor, preencha todos os campos com valores válidos.');
                return;
            }

            const divResultado = document.getElementById('resultado');
            divResultado.style.display = 'none';

            try {
                // Tenta chamar o Back-end em Python
                const response = await fetch('/api/v1/simulacao', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                if (!response.ok) throw new Error('Servidor offline');
                const res = await response.json();
                renderizarResultado(res);
                
            } catch (error) {
                // Se o servidor Python não responder (como no GitHub Pages), a lógica local assume o controle!
                console.log('Executando em modo de demonstração local (GitHub Pages).');
                const resLocal = processarSimulacaoLocal(dados);
                renderizarResultado(resLocal);
            }
        }

        function renderizarResultado(res) {
            const divResultado = document.getElementById('resultado');
            if (res.status === 'APROVADO') {
                divResultado.className = 'resultado aprovado';
                divResultado.innerHTML = `<strong>🎉 CRÉDITO APROVADO!</strong><br><br>
                    • Valor Financiado: R$ ${res.detalhes.valor_financiado.toLocaleString('pt-BR', {minimumFractionDigits: 2})}<br>
                    • Parcelas: ${res.detalhes.quantidade_parcelas}x de <strong>R$ ${res.detalhes.valor_parcela.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</strong><br>
                    • Taxa de Juros: ${res.detalhes.taxa_applied_mes} ao mês`;
            } else {
                divResultado.className = 'resultado reprovado';
                divResultado.innerHTML = `<strong>❌ CRÉDITO RECUSADO</strong><br><br>${res.motivo}`;
            }
            divResultado.style.display = 'block';
        }
    </script>
</body>
</html>
